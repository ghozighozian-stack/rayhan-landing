<div class="card" data-card-id="card-05">
  <style>
    .card[data-card-id="card-05"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    }
    .card[data-card-id="card-05"] .scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10, 10, 10, 0.1) 0%,
        rgba(10, 10, 10, 0.24) 26%,
        rgba(10, 10, 10, 0.72) 52%,
        rgba(10, 10, 10, 0.88) 100%
      );
    }
    .card[data-card-id="card-05"] .bar-top {
      position: absolute;
      left: 56px;
      top: 694px;
      width: 0;
      height: 12px;
      background: var(--accent-0);
    }
    .card[data-card-id="card-05"] .lockup {
      position: absolute;
      left: 56px;
      right: 56px;
      top: 748px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 26px;
    }
    .card[data-card-id="card-05"] .title {
      display: block;
      margin: 0;
      font-size: 116px;
      font-weight: 700;
      line-height: 0.94;
      letter-spacing: -0.045em;
      color: var(--accent-3);
    }
    .card[data-card-id="card-05"] .detail {
      display: block;
      padding: 9px 18px;
      background: var(--accent-1);
      color: #2a1c0d;
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .card[data-card-id="card-05"] .wordmark {
      position: absolute;
      left: 56px;
      bottom: 216px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .card[data-card-id="card-05"] .wordmark-chip {
      display: block;
      padding: 14px 22px 16px;
      background: var(--accent-0);
      color: #24170c;
      font-size: 46px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      box-shadow: 8px 8px 0 rgba(10, 10, 10, 0.55);
    }
    .card[data-card-id="card-05"] .dot {
      display: block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-1);
    }
  </style>

  <div class="root">
    <div
      id="card-05-scrim"
      class="scrim"
      data-anim="fade-in"
      data-anim-at="0"
      data-anim-duration="0.34"
    ></div>

    <span
      id="card-05-bar"
      class="bar-top"
      data-anim="grow-x"
      data-anim-at="0.12"
      data-anim-duration="0.46"
      data-anim-target-w="300"
    ></span>

    <div class="lockup">
      <span
        id="card-05-title"
        class="title"
        data-anim="mask-reveal"
        data-anim-at="0.22"
        data-anim-duration="0.44"
        data-anim-direction="left"
        >PESAN SEKARANG</span
      >
      <span
        id="card-05-detail"
        class="detail"
        data-anim="fade-in"
        data-anim-at="0.46"
        data-anim-duration="0.3"
        >via WhatsApp</span
      >
    </div>

    <div class="wordmark">
      <span
        id="card-05-chip"
        class="wordmark-chip"
        data-anim="slide-in"
        data-anim-at="0.5"
        data-anim-duration="0.4"
        data-anim-from="left"
        data-anim-distance="80"
        >RAYHAN.AK</span
      >
      <span
        id="card-05-dot"
        class="dot"
        data-anim="scale-pop"
        data-anim-at="0.72"
        data-anim-duration="0.3"
      ></span>
    </div>
  </div>
</div>
