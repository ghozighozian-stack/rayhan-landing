<div class="card" data-card-id="card-04">
  <style>
    .card[data-card-id="card-04"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    }
    .card[data-card-id="card-04"] .caption-slot {
      position: absolute;
      left: 44px;
      right: 44px;
      bottom: 168px;
      min-height: 220px;
    }
    .card[data-card-id="card-04"] .phrase {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px 14px;
    }
    .card[data-card-id="card-04"] .char {
      display: inline-block;
      padding: 8px 16px 12px;
      background: rgba(10, 10, 10, 0.82);
      color: var(--accent-3);
      font-size: 62px;
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.02em;
    }
    .card[data-card-id="card-04"] .char.hot {
      background: var(--accent-0);
      color: #24170c;
    }
    .card[data-card-id="card-04"] .char.warm {
      background: var(--accent-1);
      color: #2a1c0d;
    }
    .card[data-card-id="card-04"] .tick {
      position: absolute;
      left: 0;
      bottom: -28px;
      width: 0;
      height: 8px;
      background: var(--accent-1);
    }
  </style>

  <div class="root">
    <div class="caption-slot">
      <div id="card-04-pa" class="phrase" data-layout-allow-overlap>
        <span class="char">yang</span>
        <span class="char">lagi</span>
        <span class="char hot">hits</span>
      </div>
      <div id="card-04-pb" class="phrase" data-layout-allow-overlap>
        <span class="char">sekarang</span>
        <span class="char">di</span>
        <span class="char warm">RAYHAN.AK</span>
      </div>
      <span
        id="card-04-tick"
        class="tick"
        data-anim="grow-x"
        data-anim-at="0.1"
        data-anim-duration="2.4"
        data-anim-target-w="992"
      ></span>
    </div>
  </div>
</div>
