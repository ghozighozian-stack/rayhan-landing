<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>RAYHAN.AK — Recut</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-400-latin.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }

      :root {
        /* RAYHAN.AK brand palette, lifted from the landing page's own tokens. */
        --bg: #0a0a0a;
        --ink: #fff8dc;
        --text: #fff8dc;
        --accent-0: #ff6b35;
        --accent-1: #f7b801;
        --accent-2: #6f4e37;
        --accent-3: #fff8dc;
        --accent-4: #e2551f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .video-wrapper {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .video-wrapper video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-host {
        position: absolute;
        pointer-events: none;
        overflow: hidden;
      }
      .card-host .card {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .card-host .char {
        display: inline-block;
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="talking-head-recut"
      data-start="0"
      data-duration="9.1"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- Layer 1: the source clip, full-bleed and untouched. -->
      <div class="video-wrapper" id="video-wrap">
        <video
          id="bg-video"
          src="input-video.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="9.1"
          data-track-index="1"
        ></video>
      </div>
      <!-- Program audio rides a separate track so the visual video stays muted. -->
      <audio
        id="source-audio"
        src="input-video.mp4"
        data-start="0"
        data-duration="9.1"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- Layer 2: overlay cards, one host per card at its zone bounds. -->
      <div
        id="host-card-01"
        class="card-host clip"
        data-card-id="card-01"
        data-start="0.2000"
        data-duration="1.4000"
        data-track-index="2"
        style="left: 0; top: 0; width: 1080px; height: 1920px; visibility: hidden; opacity: 0"
      >
        <!--INCLUDE:card-01-->
      </div>

      <div
        id="host-card-02"
        class="card-host clip"
        data-card-id="card-02"
        data-start="0.3667"
        data-duration="2.6000"
        data-track-index="3"
        style="left: 0; top: 1344px; width: 1080px; height: 576px; visibility: hidden; opacity: 0"
      >
        <!--INCLUDE:card-02-->
      </div>

      <div
        id="host-card-03"
        class="card-host clip"
        data-card-id="card-03"
        data-start="3.0667"
        data-duration="2.1667"
        data-track-index="4"
        style="left: 0; top: 0; width: 1080px; height: 1920px; visibility: hidden; opacity: 0"
      >
        <!--INCLUDE:card-03-->
      </div>

      <div
        id="host-card-04"
        class="card-host clip"
        data-card-id="card-04"
        data-start="5.3000"
        data-duration="2.6000"
        data-track-index="5"
        style="left: 0; top: 1344px; width: 1080px; height: 576px; visibility: hidden; opacity: 0"
      >
        <!--INCLUDE:card-04-->
      </div>

      <div
        id="host-card-05"
        class="card-host clip"
        data-card-id="card-05"
        data-start="7.9667"
        data-duration="1.1333"
        data-track-index="6"
        style="left: 0; top: 0; width: 1080px; height: 1920px; visibility: hidden; opacity: 0"
      >
        <!--INCLUDE:card-05-->
      </div>

      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const tl = window.gsap.timeline({ paused: true });
          const host = (id) => '.card-host[data-card-id="' + id + '"]';
          const el = (id, sel) => '.card[data-card-id="' + id + '"] ' + sel;

          // Card enter / exit helper — the runtime owns clip visibility windows,
          // these tweens only handle the cross-fade inside each window.
          function enter(id, at, dur) {
            tl.set(host(id), { visibility: "visible" }, at);
            tl.fromTo(host(id), { opacity: 0 }, { opacity: 1, duration: dur, ease: "power2.out" }, at);
          }
          function exit(id, at, dur, hideAt) {
            tl.to(host(id), { opacity: 0, duration: dur, ease: "power2.in" }, at);
            tl.set(host(id), { visibility: "hidden" }, hideAt);
          }
          // Word-chip caption pop.
          function words(sel, at) {
            tl.fromTo(
              sel + " .char",
              { opacity: 0, y: 16, scale: 0.86 },
              {
                opacity: 1,
                y: 0,
                scale: 1,
                duration: 0.34,
                ease: "back.out(1.5)",
                stagger: 0.06,
              },
              at,
            );
          }

          /* ── card-01 · brand stamp [0.2000 → 1.6000] ───────────────────── */
          enter("card-01", 0.2, 0.35);
          tl.fromTo(
            el("card-01", "#card-01-mark"),
            { opacity: 0, x: -90 },
            { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
            0.2667,
          );
          tl.fromTo(
            el("card-01", "#card-01-rule"),
            { width: 0 },
            { width: 300, duration: 0.4, ease: "power2.out" },
            0.5333,
          );
          tl.fromTo(
            el("card-01", "#card-01-meta"),
            { opacity: 0 },
            { opacity: 1, duration: 0.35, ease: "power2.out" },
            0.7,
          );
          exit("card-01", 1.3, 0.3, 1.6);

          /* ── card-02 · caption beat A [0.3667 → 2.9667] ────────────────── */
          enter("card-02", 0.3667, 0.25);
          tl.fromTo(
            el("card-02", "#card-02-tick"),
            { width: 0 },
            { width: 992, duration: 2.4, ease: "none" },
            0.4667,
          );
          tl.set(el("card-02", "#card-02-pb"), { opacity: 0, visibility: "hidden" }, 0.3667);
          words(el("card-02", "#card-02-pa"), 0.3667);
          tl.to(
            el("card-02", "#card-02-pa"),
            { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" },
            1.6,
          );
          tl.set(el("card-02", "#card-02-pa"), { visibility: "hidden" }, 1.8);
          tl.set(el("card-02", "#card-02-pb"), { opacity: 1, visibility: "visible" }, 1.8333);
          words(el("card-02", "#card-02-pb"), 1.8333);
          exit("card-02", 2.7333, 0.23, 2.9667);

          /* ── card-03 · hero drop in the silence [3.0667 → 5.2333] ──────── */
          enter("card-03", 3.0667, 0.3);
          tl.fromTo(
            el("card-03", "#card-03-scrim"),
            { opacity: 0 },
            { opacity: 1, duration: 0.4, ease: "power2.out" },
            3.0667,
          );
          tl.fromTo(
            el("card-03", "#card-03-slab-a"),
            { opacity: 0, x: 320 },
            { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" },
            3.1333,
          );
          tl.fromTo(
            el("card-03", "#card-03-slab-c"),
            { opacity: 0, x: -170 },
            { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" },
            3.2333,
          );
          tl.fromTo(
            el("card-03", "#card-03-kicker"),
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: "power2.out" },
            3.3,
          );
          tl.fromTo(
            el("card-03", "#card-03-stripe"),
            { width: 0 },
            { width: 1140, duration: 0.55, ease: "power2.out" },
            3.3667,
          );
          tl.fromTo(
            el("card-03", "#card-03-numeral"),
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" },
            3.5,
          );
          tl.fromTo(
            el("card-03", "#card-03-t1"),
            { clipPath: "inset(0 100% 0 0)" },
            { clipPath: "inset(0 0% 0 0)", duration: 0.42, ease: "power2.inOut" },
            3.7,
          );
          tl.fromTo(
            el("card-03", "#card-03-t2"),
            { clipPath: "inset(0 100% 0 0)" },
            { clipPath: "inset(0 0% 0 0)", duration: 0.42, ease: "power2.inOut" },
            3.8,
          );
          exit("card-03", 4.9333, 0.3, 5.2333);

          /* ── card-04 · caption beat B [5.3000 → 7.9000] ────────────────── */
          enter("card-04", 5.3, 0.25);
          tl.fromTo(
            el("card-04", "#card-04-tick"),
            { width: 0 },
            { width: 992, duration: 2.4, ease: "none" },
            5.4,
          );
          tl.set(el("card-04", "#card-04-pb"), { opacity: 0, visibility: "hidden" }, 5.3);
          words(el("card-04", "#card-04-pa"), 5.3);
          tl.to(
            el("card-04", "#card-04-pa"),
            { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" },
            6.4667,
          );
          tl.set(el("card-04", "#card-04-pa"), { visibility: "hidden" }, 6.6667);
          tl.set(el("card-04", "#card-04-pb"), { opacity: 1, visibility: "visible" }, 6.7);
          words(el("card-04", "#card-04-pb"), 6.7);
          exit("card-04", 7.6667, 0.23, 7.9);

          /* ── card-05 · outro CTA [7.9667 → 9.1000] ─────────────────────── */
          enter("card-05", 7.9667, 0.3);
          tl.fromTo(
            el("card-05", "#card-05-scrim"),
            { opacity: 0 },
            { opacity: 1, duration: 0.34, ease: "power2.out" },
            7.9667,
          );
          tl.fromTo(
            el("card-05", "#card-05-bar"),
            { width: 0 },
            { width: 300, duration: 0.46, ease: "power2.out" },
            8.1,
          );
          tl.fromTo(
            el("card-05", "#card-05-title"),
            { clipPath: "inset(0 100% 0 0)" },
            { clipPath: "inset(0 0% 0 0)", duration: 0.44, ease: "power2.inOut" },
            8.2,
          );
          tl.fromTo(
            el("card-05", "#card-05-detail"),
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: "power2.out" },
            8.4333,
          );
          tl.fromTo(
            el("card-05", "#card-05-chip"),
            { opacity: 0, x: -80 },
            { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
            8.4667,
          );
          tl.fromTo(
            el("card-05", "#card-05-dot"),
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" },
            8.7,
          );
          tl.set(host("card-05"), { visibility: "hidden" }, 9.1);

          /* ── Camera: slow punch-in across the silence, released on beat B ── */
          tl.to("#video-wrap", { scale: 1.075, duration: 2.2, ease: "power1.inOut" }, 3.0667);
          tl.to("#video-wrap", { scale: 1.0, duration: 0.6, ease: "power2.out" }, 5.2667);

          window.__timelines["talking-head-recut"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
