<div class="card" data-card-id="card-03">
  <style>
    .card[data-card-id="card-03"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    }
    .card[data-card-id="card-03"] .slab-a {
      position: absolute;
      right: 0;
      top: 150px;
      width: 286px;
      height: 148px;
      background: var(--accent-1);
    }
    .card[data-card-id="card-03"] .stripe-wrap {
      position: absolute;
      left: -30px;
      top: 424px;
      width: 1140px;
      height: 8px;
      overflow: hidden;
      transform: rotate(-3deg);
    }
    .card[data-card-id="card-03"] .stripe {
      display: block;
      width: 0;
      height: 8px;
      background: var(--accent-2);
    }
    .card[data-card-id="card-03"] .kicker {
      position: absolute;
      left: 64px;
      top: 292px;
      padding: 10px 18px;
      background: var(--ink);
      color: var(--accent-3);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.26em;
    }
    .card[data-card-id="card-03"] .lockup {
      position: absolute;
      left: 64px;
      right: 64px;
      top: 512px;
      display: flex;
      align-items: center;
      gap: 36px;
    }
    .card[data-card-id="card-03"] .numeral-wrap {
      position: relative;
      display: block;
      flex: none;
    }
    .card[data-card-id="card-03"] .numeral-slab {
      position: absolute;
      left: 18px;
      top: 42px;
      width: 190px;
      height: 190px;
      background: var(--accent-0);
    }
    .card[data-card-id="card-03"] .numeral {
      position: relative;
      display: block;
      font-size: 300px;
      font-weight: 700;
      line-height: 0.82;
      letter-spacing: -0.06em;
      color: var(--ink);
    }
    .card[data-card-id="card-03"] .title {
      display: block;
    }
    .card[data-card-id="card-03"] .title-line {
      display: block;
      font-size: 92px;
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.035em;
      color: var(--ink);
    }
  </style>

  <div class="root">
    <div
      id="card-03-slab-a"
      class="slab-a"
      data-layout-allow-overflow
      data-anim="slide-in"
      data-anim-at="0.08"
      data-anim-duration="0.46"
      data-anim-from="right"
      data-anim-distance="320"
    ></div>

    <span class="stripe-wrap" data-layout-allow-overflow>
      <span
        id="card-03-stripe"
        class="stripe"
        data-layout-allow-overflow
        data-anim="grow-x"
        data-anim-at="0.3"
        data-anim-duration="0.55"
        data-anim-target-w="1140"
      ></span>
    </span>

    <span
      id="card-03-kicker"
      class="kicker"
      data-anim="fade-in"
      data-anim-at="0.22"
      data-anim-duration="0.3"
      >KOLEKSI KAMI</span
    >

    <div class="lockup">
      <span class="numeral-wrap">
        <span class="numeral-slab"></span>
        <span
          id="card-03-numeral"
          class="numeral"
          data-anim="scale-pop"
          data-anim-at="0.42"
          data-anim-duration="0.5"
          >5</span
        >
      </span>
      <span class="title">
        <span
          id="card-03-t1"
          class="title-line"
          data-anim="mask-reveal"
          data-anim-at="0.62"
          data-anim-duration="0.42"
          data-anim-direction="left"
          >PILIHAN</span
        >
        <span
          id="card-03-t2"
          class="title-line"
          data-anim="mask-reveal"
          data-anim-at="0.74"
          data-anim-duration="0.42"
          data-anim-direction="left"
          >FAVORIT</span
        >
      </span>
    </div>
  </div>
</div>
